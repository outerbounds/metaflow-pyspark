[workspace]
name = "metaflow-pyspark"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[environments]
docs = ["docs"]

[feature.docs.dependencies]
python = "3.13.*"
zensical = ">=0.0.66"

[feature.docs.tasks]
docs-build = "zensical build --clean"
docs-serve = "zensical serve"
