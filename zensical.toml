[project]
site_name = "metaflow-pyspark"
site_description = "Spark sessions and governed Databricks data for Metaflow"
site_url = "https://outerbounds.github.io/metaflow-pyspark/"
site_dir = "builtdocs"
repo_url = "https://github.com/outerbounds/metaflow-pyspark"
repo_name = "outerbounds/metaflow-pyspark"
edit_uri = "edit/main/docs/"
nav = [
  {"Home" = "index.md"},
  {"How-to" = [
    {"Use @spark" = "how-to/spark-decorator.md"},
    {"Read Data" = "how-to/read-data.md"},
    {"Write Data" = "how-to/write-data.md"},
  ]},
]

[project.theme]
variant = "modern"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"

[project.theme.palette.toggle]
icon = "lucide/sun"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"

[project.theme.palette.toggle]
icon = "lucide/moon"
name = "Switch to light mode"

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/outerbounds/metaflow-pyspark"
